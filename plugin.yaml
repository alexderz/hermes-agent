name: intercom
version: 0.3.0
description: "Local cross-session messaging: sessions discover each other and exchange plain-text messages via Unix sockets. Delivered mid-turn via steer or at next turn when idle."
author: "majordave"
kind: standalone
provides_tools:
  - intercom
provides_hooks:
  - post_llm_call
  - pre_llm_call
  - pre_api_request
